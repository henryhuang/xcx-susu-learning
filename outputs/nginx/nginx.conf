worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    server {
        listen 80;
        server_name resources.cnhalo.com;
        root /app/resources;
        autoindex off;

        location / {
            try_files $uri =404;
        }

        # Always revalidate the course update descriptor.
        location ~ /latest\.json$ {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Do not serve hidden files or directories.
        location ~ (^|/)\. {
            deny all;
        }
    }
}
